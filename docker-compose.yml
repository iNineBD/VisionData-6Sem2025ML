services:
  app:
    build: .
    container_name: predict_tickets_app
    env_file:
      - .env
    environment:
      - GIT_PYTHON_REFRESH=quiet
      - TARGET_API_URL
      - TARGET_USER_EMAIL
      - TARGET_USER_PASSWORD
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    container_name: mlflow_server
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
    ports:
      - "5000:5000"
    restart: unless-stopped
