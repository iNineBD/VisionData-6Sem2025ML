services:
  app:
    build: .
    container_name: predict_tickets_app
    environment:
      - GIT_PYTHON_REFRESH=quiet
    ports:
      - "8000:8000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    container_name: mlflow_server
    environment:
      - GIT_PYTHON_REFRESH=quiet
    command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
    ports:
      - "5000:5000"
    restart: unless-stopped
